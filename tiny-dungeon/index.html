<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tiny Dungeon DEV</title><link rel="stylesheet" href="style.css"></head><body>
<div class="start" id="start"><div class="startbox"><div class="logo">TINY DUNGEON <span class="devtag">DEV</span></div><div class="sub">Wybierz bohatera i zejdź do podziemi.</div><div class="namebox"><input id="heroName" maxlength="18" placeholder="Imię bohatera" value="Bohater"></div><div class="classes">
<button class="classcard selected" data-class="berserker"><div class="portrait"><div class="head"></div><div class="bodyshape" style="background:#7b3c35"></div><div class="blade l"></div><div class="blade r"></div></div><h3>Berserker</h3><p>Dwie bronie naraz, +5% obrażeń fizycznych, więcej HP. Wolniejszy. Bez many i czarów.</p></button>
<button class="classcard" data-class="mage"><div class="portrait"><div class="head"></div><div class="bodyshape" style="background:#494b8c"></div><div class="staff"></div><div class="orb"></div></div><h3>Mag</h3><p>+5% obrażeń czarami. Nowe zaklęcia odblokowują się wraz z poziomem.</p></button>
<button class="classcard" data-class="paladin"><div class="portrait"><div class="head"></div><div class="bodyshape" style="background:#a28e5d"></div><div class="shield"></div><div class="blade r"></div></div><h3>Paladyn</h3><p>Mniej many, +10% pancerza, regeneracja 5% HP/s. Bez kuli ognia i wampiryzmu. Ma Leczenie.</p></button>
<button class="classcard" data-class="rogue"><div class="portrait"><div class="head"></div><div class="bodyshape" style="background:#3d665a"></div><div class="dagger"></div><div class="blade l"></div></div><h3>Złodziej</h3><p>+15% szybkości, -10% pancerza, dwie bronie, +35% obrażeń krytycznych. Bez czarów.</p></button>
</div><button class="startbtn" id="startBtn">ROZPOCZNIJ</button></div></div>
<main><div class="top"><div class="pill identity"><b id="who"></b><br><span id="className"></span></div><div class="pill hp">HP <b id="hp"></b><div class="bar"><i id="hb"></i></div></div><div class="pill mp" id="manaPill">Mana <b id="mana"></b><div class="bar"><i id="mb"></i></div></div><div class="pill xp">XP <b id="xp"></b><div class="bar"><i id="xb"></i></div></div><div class="pill">Piętro <b id="fl">1</b></div><div class="pill">LVL <b id="lv">1</b></div><div class="pill">Złoto <b id="go">0</b></div><button class="soundbtn" id="soundBtn">DŹWIĘK ON</button><button class="soundbtn" id="musicBtn">MUZYKA ON</button><div class="stats"><div class="stat"><span>Obrażenia</span><b id="stDmg"></b></div><div class="stat"><span>Armor</span><b id="stArm"></b></div><div class="stat"><span>Szybkość</span><b id="stSpd"></b></div><div class="stat"><span>Crit</span><b id="stCrit"></b></div><div class="stat"><span>Crit dmg</span><b id="stCritDmg"></b></div><div class="stat"><span>Wampiryzm</span><b id="stVamp"></b></div><div class="stat"><span>Regeneracja</span><b id="stReg"></b></div><div class="stat"><span>Zasięg</span><b id="stRange"></b></div></div><div class="spellbar" id="spellbar"></div></div><div class="wrap"><canvas id="c"></canvas><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="actions"><div class="castwrap" id="cw"><button class="cast" id="cast">CZAR</button></div><button class="atk" id="atk">ATAK</button></div></div></main>
<div class="overlay" id="shop"><div class="panel"><h2>Kupiec podziemi</h2><p>Złoto: <b id="sg"></b></p><div class="grid" id="items"></div><p><button id="closeShop">Wróć do lochu</button></p></div></div><div class="overlay" id="lu"><div class="panel"><h2>Nowa umiejętność</h2><div class="grid" id="skills"></div></div></div><div class="toast" id="toast"></div>
<script src="game-1.js"></script><script src="game-2.js"></script><script src="game-3.js"></script><script src="game-4.js"></script><script src="game-5.js"></script></body></html>
