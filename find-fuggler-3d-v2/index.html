<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Znajdź Fugglera 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,Arial;touch-action:none;user-select:none}canvas{display:block}#ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:#111c;border:1px solid #ffffff2c;border-radius:12px;padding:8px 11px;font-weight:800}#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff}#cross:before{width:2px;height:18px;left:8px}#cross:after{width:18px;height:2px;top:8px}#prompt{position:absolute;left:50%;top:calc(50% + 28px);transform:translateX(-50%);background:#000a;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:900;opacity:0}#toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:#241711e8;border:1px solid #d88c55;border-radius:12px;padding:10px 14px;font-weight:900;opacity:0}#joy{position:absolute;left:20px;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));width:126px;height:126px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:auto}#stick{position:absolute;width:50px;height:50px;left:38px;top:38px;border-radius:50%;background:#ffffff4a;border:2px solid #fff5}#buttons{position:absolute;right:18px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));display:grid;grid-template-columns:70px 70px;gap:10px;pointer-events:auto}.b{height:58px;border-radius:16px;border:1px solid #ffffff3b;background:#171717d8;color:#fff;font-weight:900}#action{grid-column:1/3;background:#75371ed9;border-color:#dd8b58}#drop{display:none}#start,#done{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:linear-gradient(#86b7d5,#d7c7a5)}#done{display:none;background:#090806df;color:#fff;z-index:40}.panel{max-width:480px;background:#f8eadde9;color:#261f1a;border:2px solid #69513f;border-radius:20px;padding:22px}.panel button{padding:13px 20px;border:0;border-radius:13px;background:#632f1c;color:#fff;font-weight:900;font-size:16px}#done .panel{background:#221b17;color:#fff}</style></head><body><div id="start"><div class="panel"><h1>Znajdź Fugglera 3D</h1><p>Przeszukaj miasteczko z widoku pierwszej osoby.</p><p><b>Telefon:</b> joystick = ruch, przeciąganie po prawej stronie = rozglądanie.</p><button id="play">WEJDŹ DO MIASTA</button></div></div><div id="ui"><div id="top"><div class="pill">🏙️ Miasteczko Fugglerów</div><div class="pill" id="score">Znalezione: 0 / 6</div></div><div id="cross"></div><div id="prompt"></div><div id="toast"></div><div id="joy"><div id="stick"></div></div><div id="buttons"><button class="b" id="action">AKCJA</button><button class="b" id="drop">UPUŚĆ</button><button class="b" id="jump">SKOK</button></div></div><div id="done"><div class="panel"><h1>🎉 Wszystkie znalezione!</h1><button onclick="location.reload()">ZAGRAJ JESZCZE RAZ</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ab9d7);scene.fog=new THREE.Fog(0x8ab9d7,35,95);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.08,140);camera.rotation.order='YXZ';const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x665b45,2.3));const sun=new THREE.DirectionalLight(0xffefc8,2);sun.position.set(25,35,15);scene.add(sun);const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),M(0x66824b));ground.rotation.x=-Math.PI/2;scene.add(ground);for(let x=-36;x<=36;x+=24){let o=new THREE.Mesh(new THREE.BoxGeometry(7,.08,94),M(0x4b5055));o.position.set(x,.04,0);scene.add(o)}for(let z=-36;z<=36;z+=24){let o=new THREE.Mesh(new THREE.BoxGeometry(94,.08,7),M(0x4b5055));o.position.set(0,.05,z);scene.add(o)}
const solids=[],inter=[],fugglers=[];let held=null,found=0;function cube(x,y,z,w,h,d,c,solid=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));o.position.set(x,y,z);scene.add(o);if(solid)solids.push({o,w,d});return o}function wall(x,z,w,d,h=3.2,c=0xcaaa80){return cube(x,h/2,z,w,h,d,c)}function door(x,z,ry=0){let g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;let d=new THREE.Mesh(new THREE.BoxGeometry(1.05,2.15,.12),M(0x71472d));d.position.set(.525,1.075,0);g.add(d);g.userData={type:'door',open:false,goal:ry,closed:ry};scene.add(g);inter.push(g);return g}function house(cx,cz,c,side){let w=8,d=8,t=.35,h=3.2;wall(cx-w/2,cz,t,d,h,c);wall(cx+w/2,cz,t,d,h,c);if(side==='s'){wall(cx-2.6,cz-d/2,2.8,t,h,c);wall(cx+2.6,cz-d/2,2.8,t,h,c);door(cx-.52,cz-d/2-.05,0);wall(cx,cz+d/2,w,t,h,c)}else{wall(cx-2.6,cz+d/2,2.8,t,h,c);wall(cx+2.6,cz+d/2,2.8,t,h,c);door(cx+.52,cz+d/2+.05,Math.PI);wall(cx,cz-d/2,w,t,h,c)}cube(cx,.08,cz,7.5,.16,7.5,0xb9aa94,false)}house(-12,-12,0xc88f70,'s');house(12,-12,0xdfbd73,'s');house(-12,12,0x9fb7a0,'n');house(12,12,0xc58ca3,'n');for(const [x,z,c] of [[-36,-12,0x9b8579],[-36,12,0xc9b080],[36,-12,0xa8a08b],[36,12,0xb48a72],[-12,36,0x8b9eaf],[12,36,0xb5a094]])cube(x,2.8,z,11,5.6,11,c);
for(let i=0;i<14;i++){let x=(Math.random()-.5)*65,z=(Math.random()-.5)*65,o=cube(x,.4,z,.65,.8,.65,0x805d43,false);o.userData={type:'item',name:'Pudełko'};inter.push(o)}function fug(x,z,c){let g=new THREE.Group();g.position.set(x,.6,z);let b=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),M(c));g.add(b);for(const ex of [-.18,.18]){let e=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),M(0xffffff));e.position.set(ex,.15,.42);g.add(e);let p=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),M(0x111111));p.position.set(ex,.15,.51);g.add(p)}let mouth=new THREE.Mesh(new THREE.BoxGeometry(.5,.16,.08),M(0x341515));mouth.position.set(0,-.16,.46);g.add(mouth);for(let i=0;i<5;i++){let t=new THREE.Mesh(new THREE.ConeGeometry(.04,.13,4),M(0xfff1d2));t.rotation.x=Math.PI;t.position.set(-.18+i*.09,-.09,.53);g.add(t)}g.userData={type:'fuggler'};scene.add(g);inter.push(g);fugglers.push(g)}fug(-12,-12,0xff705f);fug(12,-12,0x83cf7c);fug(-12,12,0x8d79d6);fug(12,12,0xf1cc54);fug(4,28,0x5dc4c6);fug(-28,4,0xf187b8);
const player={p:new THREE.Vector3(0,1.68,6),yaw:0,pitch:0,vy:0,ground:true};camera.position.copy(player.p);function hit(x,z){for(const s of solids)if(Math.abs(x-s.o.position.x)<s.w/2+.32&&Math.abs(z-s.o.position.z)<s.d/2+.32)return true;return false}const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyE')act();if(e.code==='KeyQ')drop();if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.code]=0);addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){player.yaw-=e.movementX*.0024;player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch-e.movementY*.0022))}});renderer.domElement.addEventListener('click',()=>{if(!('ontouchstart'in window))renderer.domElement.requestPointerLock?.()});
let jx=0,jy=0,jid=null;const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width*.34,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};function je(e){if(e.pointerId===jid){jid=null;jx=jy=0;stick.style.transform=''}}joy.onpointerup=je;joy.onpointercancel=je;let lid=null,lx=0,ly=0;renderer.domElement.onpointerdown=e=>{if(e.clientX>innerWidth*.34){lid=e.pointerId;renderer.domElement.setPointerCapture?.(lid);lx=e.clientX;ly=e.clientY}};renderer.domElement.onpointermove=e=>{if(e.pointerId===lid){player.yaw-=(e.clientX-lx)*.005;player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch-(e.clientY-ly)*.0045));lx=e.clientX;ly=e.clientY}};renderer.domElement.onpointerup=e=>{if(e.pointerId===lid)lid=null};function jump(){if(player.ground){player.vy=4.7;player.ground=false}}document.querySelector('#jump').onclick=jump;document.querySelector('#action').onclick=act;document.querySelector('#drop').onclick=drop;
const ray=new THREE.Raycaster();let target=null;function root(o){let n=o;while(n.parent&&n.parent!==scene&&!n.userData.type)n=n.parent;return n}function scan(){ray.setFromCamera(new THREE.Vector2(),camera);let ms=[];for(const o of inter)if(o.visible)o.traverse(c=>c.isMesh&&ms.push(c));let hs=ray.intersectObjects(ms),p=document.querySelector('#prompt');target=null;for(const h of hs){if(h.distance>2.5)break;let n=root(h.object);if(n.userData.type){target=n;break}}if(target){p.textContent=target.userData.type==='door'?(target.userData.open?'ZAMKNIJ':'OTWÓRZ'):target.userData.type==='item'?'PODNIEŚ':'ZNAJDŹ FUGGLERA';p.style.opacity=1}else p.style.opacity=0}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,1500)}function act(){scan();if(!target)return;if(target.userData.type==='door'){target.userData.open=!target.userData.open;target.userData.goal=target.userData.closed+(target.userData.open?-Math.PI/2:0);toast(target.userData.open?'Drzwi otwarte':'Drzwi zamknięte')}else if(target.userData.type==='item'){if(held)return toast('Najpierw upuść przedmiot');held=target;document.querySelector('#drop').style.display='block';toast('Podniesiono')}else{target.visible=false;found++;document.querySelector('#score').textContent=`Znalezione: ${found} / 6`;toast('🎉 Znalazłeś Fugglera!');if(found===6)setTimeout(()=>document.querySelector('#done').style.display='flex',500)}}function drop(){if(!held)return;let v=new THREE.Vector3(0,-.4,-1.2).applyEuler(new THREE.Euler(0,player.yaw,0));held.position.copy(player.p).add(v);held.position.y=.4;held=null;document.querySelector('#drop').style.display='none'}
let last=performance.now();function frame(t){requestAnimationFrame(frame);let dt=Math.min(.035,(t-last)/1000);last=t;for(const d of inter)if(d.userData.type==='door')d.rotation.y+=(d.userData.goal-d.rotation.y)*Math.min(1,dt*8);let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-jy,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,l=Math.hypot(f,s);if(l>1){f/=l;s/=l}let si=Math.sin(player.yaw),co=Math.cos(player.yaw),sp=4,dx=(s*co-f*si)*sp*dt,dz=(-s*si-f*co)*sp*dt,nx=player.p.x+dx;if(!hit(nx,player.p.z))player.p.x=nx;let nz=player.p.z+dz;if(!hit(player.p.x,nz))player.p.z=nz;player.vy-=11*dt;player.p.y+=player.vy*dt;if(player.p.y<=1.68){player.p.y=1.68;player.vy=0;player.ground=true}camera.position.copy(player.p);camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;if(held){let v=new THREE.Vector3(0,-.25,-1).applyEuler(camera.rotation);held.position.copy(camera.position).add(v)}scan();renderer.render(scene,camera)}requestAnimationFrame(frame);document.querySelector('#play').onclick=()=>{document.querySelector('#start').style.display='none';toast('Znajdź 6 Fugglerów!')};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
