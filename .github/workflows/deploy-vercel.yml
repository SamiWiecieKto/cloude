name: Deploy sites to Vercel

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to deploy (all | agencja-seo | pozycjonowanie-stron)"
        required: false
        default: "all"
        type: string
  push:
    branches:
      - claude/seonim-agency-pages-ya9f7z
    paths:
      - "sites/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE: ${{ inputs.site || 'all' }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy agencja-seo
        if: ${{ env.SITE == 'all' || env.SITE == 'agencja-seo' }}
        working-directory: sites/agencja-seo
        run: |
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "--- project domains ---"
          npx vercel@latest project ls --token "$VERCEL_TOKEN" 2>&1 | grep -i agencja || true

      - name: Deploy pozycjonowanie-stron
        if: ${{ env.SITE == 'all' || env.SITE == 'pozycjonowanie-stron' }}
        working-directory: sites/pozycjonowanie-stron
        run: |
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "--- project domains ---"
          npx vercel@latest project ls --token "$VERCEL_TOKEN" 2>&1 | grep -i pozycjonowanie || true
