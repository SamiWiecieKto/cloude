<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Znajdź Fugglera!</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#17202a;color:#fff;overflow:hidden;touch-action:manipulation}.top{height:70px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;background:#111820;border-bottom:3px solid #f4c542}.title{font-size:22px;font-weight:900}.sub{font-size:12px;color:#ccd}.level{background:#f4c542;color:#222;padding:8px 12px;border-radius:12px;font-weight:900}.scene{position:relative;height:calc(100vh - 70px);overflow:hidden;background:linear-gradient(#83c9ff 0 42%,#70ad55 42% 100%)}.cloud{position:absolute;background:#fff;border-radius:30px;opacity:.9}.house{position:absolute;width:140px;height:110px;background:#e7a45d;border:6px solid #8b5737}.house:before{content:'';position:absolute;left:-20px;top:-65px;border-left:85px solid transparent;border-right:85px solid transparent;border-bottom:70px solid #b64b3e}.tree{position:absolute;width:28px;height:110px;background:#765039}.tree:after{content:'';position:absolute;width:100px;height:100px;border-radius:50%;background:#438b43;left:-36px;top:-55px}.thing{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;filter:drop-shadow(0 4px 2px #0004);cursor:pointer}.toy{font-size:clamp(28px,5vw,52px)}.monster{width:58px;height:66px;border-radius:42% 48% 35% 35%;background:#8e44ad;border:3px solid #4c2860}.monster:before,.monster:after{content:'';position:absolute;width:13px;height:13px;background:#fff;border:3px solid #222;border-radius:50%;top:15px}.monster:before{left:10px}.monster:after{right:10px}.mouth{position:absolute;left:9px;right:9px;bottom:10px;height:20px;background:#171717;border-radius:4px 4px 14px 14px;border:2px solid #eee;background-image:repeating-linear-gradient(90deg,#fff 0 7px,#222 7px 9px)}.ear{position:absolute;width:20px;height:27px;background:inherit;border:3px solid #4c2860;top:16px;z-index:-1}.ear.l{left:-15px;transform:rotate(-25deg)}.ear.r{right:-15px;transform:rotate(25deg)}.fake{transform:scale(.8);filter:saturate(.5) drop-shadow(0 4px 2px #0004)}.win{display:none;position:fixed;inset:0;z-index:10;background:#0009;align-items:center;justify-content:center}.card{background:#fff;color:#222;border-radius:22px;padding:26px;text-align:center;width:min(360px,88vw);border:6px solid #f4c542;box-shadow:0 20px 60px #0008}.card h2{font-size:30px;margin:0 0 8px}.card p{margin:5px 0 18px}.card button{border:0;background:#7d3c98;color:#fff;padding:14px 22px;border-radius:12px;font-size:17px;font-weight:900}.hint{position:absolute;left:12px;bottom:12px;background:#111c;padding:8px 12px;border-radius:10px;font-size:12px}@media(max-width:600px){.title{font-size:18px}.top{height:62px}.scene{height:calc(100vh - 62px)}} </style></head><body><div class="top"><div><div class="title">🔎 ZNAJDŹ FUGGLERA!</div><div class="sub">Rozejrzyj się dokładnie. Nie ma limitu czasu.</div></div><div class="level">Plansza <span id="lv">1</span></div></div><div class="scene" id="scene"><div class="hint">👀 Dotknij Fugglera, gdy go znajdziesz</div></div><div class="win" id="win"><div class="card"><h2>🎉 Znalazłeś go!</h2><p>Fuggler nie zdołał się przed Tobą ukryć.</p><button id="next">NASTĘPNA PLANSZA →</button></div></div><script>const scene=document.querySelector('#scene'),win=document.querySelector('#win'),lvEl=document.querySelector('#lv');let level=1;const emojis=['🧸','🚗','⚽','🎈','🪁','🛴','🌻','🍄','🐸','🐝','🐞','🦋','🐿️','🪵','🪨','🌷','🛹','🧢','🥎','🦆','🐌','🌼','🪣','🏀'];function pos(el,x,y){el.style.left=x+'%';el.style.top=y+'%'}function monster(fake=false){let m=document.createElement('div');m.className='thing monster'+(fake?' fake':'');m.innerHTML='<i class="ear l"></i><i class="ear r"></i><i class="mouth"></i>';return m}function build(){scene.querySelectorAll('.thing,.house,.tree,.cloud').forEach(x=>x.remove());lvEl.textContent=level;let h=document.createElement('div');h.className='house';pos(h,8,24);scene.appendChild(h);for(let i=0;i<3;i++){let t=document.createElement('div');t.className='tree';pos(t,60+i*15,30+(i%2)*15);scene.appendChild(t)}for(let i=0;i<3;i++){let c=document.createElement('div');c.className='cloud';c.style.width=70+Math.random()*80+'px';c.style.height='25px';pos(c,10+i*30,7+Math.random()*12);scene.appendChild(c)}let n=Math.min(18+level*5,55);for(let i=0;i<n;i++){let e=document.createElement('div');e.className='thing toy';e.textContent=emojis[Math.floor(Math.random()*emojis.length)];pos(e,2+Math.random()*92,18+Math.random()*73);e.style.transform=`rotate(${Math.random()*30-15}deg) scale(${.75+Math.random()*.45})`;scene.appendChild(e)}for(let i=0;i<Math.min(Math.floor(level/2),5);i++){let f=monster(true);pos(f,5+Math.random()*88,18+Math.random()*70);scene.appendChild(f)}let f=monster();f.style.background=['#8e44ad','#d35400','#2471a3','#b03a2e','#138d75'][level%5];pos(f,7+Math.random()*84,20+Math.random()*67);f.onclick=e=>{e.stopPropagation();win.style.display='flex'};scene.appendChild(f)}document.querySelector('#next').onclick=()=>{win.style.display='none';level++;build()};build();</script></body></html>
