<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Crime City Classic</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101214;touch-action:none;user-select:none;font-family:system-ui,Arial}canvas{display:block}#hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;text-shadow:0 2px 3px #000;font-weight:800}#top{position:absolute;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px}.box{background:#111d;border:1px solid #fff3;border-radius:10px;padding:7px 10px;font-size:13px}#joy{position:absolute;left:18px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:120px;height:120px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:auto}#stick{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffff50}#buttons{position:absolute;right:16px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));display:grid;grid-template-columns:78px 78px;gap:9px;pointer-events:auto}.b{height:58px;border:1px solid #fff4;border-radius:14px;background:#1b1b1be8;color:#fff;font-weight:900}.action{grid-column:1/3;background:#8a3b24e8}#start{position:fixed;inset:0;z-index:100;background:linear-gradient(#26343b,#55483c);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:22px}.panel{max-width:430px;background:#111e;border:1px solid #fff3;border-radius:18px;padding:22px}.panel button{position:relative;z-index:101;pointer-events:auto;border:0;border-radius:12px;background:#bd522d;color:#fff;padding:14px 22px;font-weight:900;font-size:17px}#tip{position:absolute;left:50%;bottom:165px;transform:translateX(-50%);background:#111c;border-radius:9px;padding:7px 10px;font-size:12px;opacity:.8}</style></head><body><canvas id="c"></canvas><div id="hud"><div id="top"><div class="box">CRIME CITY CLASSIC</div><div class="box" id="status">PIESZO · PISTOLET</div><div class="box" id="wanted">☆ ☆ ☆ ☆ ☆</div></div><div id="tip">Joystick = ruch · AKCJA = auto · STRZAŁ = broń</div><div id="joy"><div id="stick"></div></div><div id="buttons"><button class="b action" id="action">WEJDŹ DO AUTA</button><button class="b" id="shoot">STRZAŁ</button><button class="b" id="weapon">BROŃ</button></div></div><div id="start"><div class="panel"><h1>CRIME CITY CLASSIC</h1><p>Duże żyjące miasto z ruchem ulicznym, pieszymi, policją i samochodami do przejmowania.</p><button id="play" type="button">WEJDŹ DO MIASTA</button></div></div><script>
(()=>{'use strict';const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,1.5),running=false;function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);const WORLD=3000,ROAD=150,BLOCK=300,HALF=ROAD/2,LANE=25;const roads=[];for(let x=0;x<=WORLD;x+=BLOCK)roads.push({x:x-HALF,y:0,w:ROAD,h:WORLD,v:true});for(let y=0;y<=WORLD;y+=BLOCK)roads.push({x:0,y:y-HALF,w:WORLD,h:ROAD,v:false});const buildings=[],parks=[],lots=[];const districtNames=['CENTRUM','PORT','OSIEDLE','MAGAZYNY','PARKOWA','STARE MIASTO'];for(let gx=0;gx<WORLD;gx+=BLOCK)for(let gy=0;gy<WORLD;gy+=BLOCK){let ix=gx/BLOCK,iy=gy/BLOCK,m=HALF+20,x=gx+m,y=gy+m,w=BLOCK-2*m,h=BLOCK-2*m,type=(ix*3+iy*5)%11;if(type===0){parks.push({x,y,w,h});continue}if(type===1){lots.push({x,y,w,h});continue}buildings.push({x,y,w,h,c:['#8d7567','#a68c6f','#747d82','#a26f63','#79846e','#927e91'][(ix+iy)%6],roof:['#3d4041','#51443c','#504f49'][(ix*2+iy)%3],kind:type%3})}const colors=['#c23d36','#3972a4','#d0a23c','#4f8b5e','#ddd6c8','#292c30','#8b4c88','#d66d31','#6f7e8c','#b7b94c'];const types=[{n:'sedan',w:36,h:18,max:5.2,a:.12},{n:'sport',w:38,h:17,max:7.2,a:.16},{n:'van',w:43,h:21,max:4.7,a:.09},{n:'taxi',w:37,h:18,max:5.5,a:.12},{n:'truck',w:50,h:23,max:4.1,a:.07},{n:'compact',w:31,h:16,max:5.8,a:.14},{n:'police',w:39,h:19,max:6.3,a:.14}];const player={x:WORLD/2+40,y:WORLD/2+40,a:0,inCar:null},cars=[],peds=[],bullets=[],particles=[];let wanted=0,wantedCool=0,weapon=0;const weapons=['PISTOLET','SMG','SHOTGUN'];function roadCell(v){return Math.round(v/BLOCK)*BLOCK}function onRoad(x,y){return Math.abs(x-roadCell(x))<HALF||Math.abs(y-roadCell(y))<HALF}function inBuilding(x,y,r=8){return buildings.some(b=>x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)}function spawnCar(i,police=false){let vertical=Math.random()<.5,dir=Math.random()<.5?1:-1,grid=Math.floor(Math.random()*(WORLD/BLOCK))*BLOCK,pos=Math.random()*WORLD,t=police?types[6]:types[i%(types.length-1)],x=vertical?grid+(dir>0?-LANE:LANE):pos,y=vertical?pos:grid+(dir>0?LANE:-LANE),a=vertical?(dir>0?Math.PI/2:-Math.PI/2):(dir>0?0:Math.PI);cars.push({x,y,a,s:1.5+Math.random()*1.7,target:0,type:t,c:police?'#183e75':colors[i%colors.length],ai:true,police,hp:police?5:3,turnLock:0})}for(let i=0;i<85;i++)spawnCar(i);for(let i=0;i<110;i++){let p={};do{p.x=Math.random()*WORLD;p.y=Math.random()*WORLD}while(onRoad(p.x,p.y)||inBuilding(p.x,p.y,8));p.y=Math.max(10,Math.min(WORLD-10,p.y));p.x=Math.max(10,Math.min(WORLD-10,p.x));p.a=Math.random()*6.28;p.s=.35+Math.random()*.45;p.c=colors[(i+2)%colors.length];peds.push(p)}function addWanted(n=1){wanted=Math.max(0,Math.min(5,wanted+n));wantedCool=900;hud()}function hud(){document.getElementById('status').textContent=(player.inCar?player.inCar.type.n.toUpperCase():'PIESZO')+' · '+weapons[weapon];document.getElementById('action').textContent=player.inCar?'WYJDŹ Z AUTA':'WEJDŹ DO AUTA';document.getElementById('wanted').textContent='★ '.repeat(wanted)+'☆ '.repeat(5-wanted)}function startGame(){document.getElementById('start').style.display='none';running=true;cv.focus()}window.startGame=startGame;document.getElementById('play').addEventListener('pointerup',startGame,{once:true});document.getElementById('play').addEventListener('click',startGame,{once:true});let keys={},jx=0,jy=0,jid=null;addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyE')action();if(e.code==='Space')shoot();if(e.code==='KeyR')cycleWeapon()});addEventListener('keyup',e=>keys[e.code]=0);const joy=document.getElementById('joy'),stick=document.getElementById('stick');function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=42,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});function je(e){if(e.pointerId===jid){jid=null;jx=jy=0;stick.style.transform=''}}joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);document.getElementById('action').onclick=action;document.getElementById('shoot').onclick=shoot;document.getElementById('weapon').onclick=cycleWeapon;function cycleWeapon(){weapon=(weapon+1)%weapons.length;hud()}function action(){if(!running)return;if(player.inCar){let c=player.inCar,ex=c.x+Math.cos(c.a+Math.PI/2)*30,ey=c.y+Math.sin(c.a+Math.PI/2)*30;if(!inBuilding(ex,ey)){player.x=ex;player.y=ey;c.ai=false;c.s*=.5;player.inCar=null;hud()}return}let best=null,bd=48;for(const c of cars){let d=Math.hypot(c.x-player.x,c.y-player.y);if(d<bd){bd=d;best=c}}if(best){if(best.police)addWanted(2);else addWanted(1);best.ai=false;player.inCar=best;player.x=best.x;player.y=best.y;hud()}}function shoot(){if(!running||player.inCar)return;addWanted(1);let n=weapon===2?6:1,spread=weapon===2?.11:0;for(let i=0;i<n;i++){let a=player.a+(i-(n-1)/2)*spread;bullets.push({x:player.x,y:player.y,a,life:weapon===1?70:55,s:weapon===1?13:10,dmg:weapon===2?1.2:1})}}function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle='#16191b';ctx.fillRect(-c.type.w*.37,-c.type.h*.65,c.type.w*.22,c.type.h*1.3);ctx.fillRect(c.type.w*.15,-c.type.h*.65,c.type.w*.22,c.type.h*1.3);ctx.fillStyle=c.c;ctx.fillRect(-c.type.w/2,-c.type.h/2,c.type.w,c.type.h);ctx.fillStyle='#94b6c4';ctx.fillRect(-c.type.w*.12,-c.type.h*.36,c.type.w*.32,c.type.h*.72);if(c.type.n==='taxi'){ctx.fillStyle='#d7b82c';ctx.fillRect(-4,-c.type.h*.65,8,4)}if(c.police){ctx.fillStyle='#dfe8ef';ctx.fillRect(-c.type.w*.18,-c.type.h/2,c.type.w*.28,c.type.h);ctx.fillStyle='#d33';ctx.fillRect(-3,-c.type.h*.72,4,3);ctx.fillStyle='#38f';ctx.fillRect(1,-c.type.h*.72,4,3)}ctx.fillStyle='#eee0a5';ctx.fillRect(c.type.w/2-2,-c.type.h*.3,3,4);ctx.fillRect(c.type.w/2-2,c.type.h*.08,3,4);ctx.restore()}function drawPed(p,hero=false){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=hero?'#f2d24c':p.c;ctx.beginPath();ctx.arc(0,0,hero?10:7,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(3,-2,hero?12:9,4);ctx.restore()}function drawWorld(){ctx.fillStyle='#567246';ctx.fillRect(0,0,WORLD,WORLD);for(const r of roads){ctx.fillStyle='#42484b';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#d8d0a6';ctx.lineWidth=2;ctx.setLineDash([18,16]);if(r.v){ctx.beginPath();ctx.moveTo(r.x+r.w/2,0);ctx.lineTo(r.x+r.w/2,WORLD);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(0,r.y+r.h/2);ctx.lineTo(WORLD,r.y+r.h/2);ctx.stroke()}}ctx.setLineDash([]);for(const p of parks){ctx.fillStyle='#47713d';ctx.fillRect(p.x,p.y,p.w,p.h);for(let i=0;i<12;i++){let x=p.x+15+(i*37)%Math.max(20,p.w-30),y=p.y+20+(i*53)%Math.max(20,p.h-40);ctx.fillStyle='#315f32';ctx.beginPath();ctx.arc(x,y,10+(i%3)*3,0,6.28);ctx.fill()}}for(const l of lots){ctx.fillStyle='#696b69';ctx.fillRect(l.x,l.y,l.w,l.h);ctx.strokeStyle='#ddd';for(let y=l.y+18;y<l.y+l.h-10;y+=28){ctx.beginPath();ctx.moveTo(l.x+8,y);ctx.lineTo(l.x+l.w-8,y);ctx.stroke()}}for(const b of buildings){ctx.fillStyle='#bbb6ab';ctx.fillRect(b.x-12,b.y-12,b.w+24,b.h+24);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle=b.roof;ctx.fillRect(b.x+7,b.y+7,b.w-14,b.h-14);ctx.fillStyle='#72a1b7';for(let x=b.x+15;x<b.x+b.w-10;x+=25){ctx.fillRect(x,b.y+14,12,8);ctx.fillRect(x,b.y+b.h-22,12,8)}if(b.kind===1){ctx.fillStyle='#d3ba74';ctx.fillRect(b.x+b.w*.2,b.y+b.h*.45,b.w*.6,8)}}for(const p of peds)drawPed(p);for(const c of cars)drawCar(c);for(const b of bullets){ctx.fillStyle='#ffd85a';ctx.beginPath();ctx.arc(b.x,b.y,3,0,6.28);ctx.fill()}for(const q of particles){ctx.globalAlpha=q.life/20;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1;if(!player.inCar)drawPed(player,true)}function trafficAI(c){if(c.police&&wanted>0){let tx=player.x-c.x,ty=player.y-c.y,des=Math.atan2(ty,tx),dif=Math.atan2(Math.sin(des-c.a),Math.cos(des-c.a));c.a+=Math.max(-.055,Math.min(.055,dif));c.s+=(c.type.max-c.s)*.025;return}if(c.turnLock>0)c.turnLock--;let nearX=Math.abs(c.x-roadCell(c.x))<4,nearY=Math.abs(c.y-roadCell(c.y))<4;if(c.turnLock<=0&&nearX&&nearY&&Math.random()<.018){let turn=Math.random()<.5?-1:1;c.a+=turn*Math.PI/2;c.turnLock=40}c.s+=(Math.min(c.type.max*.52,2.7)-c.s)*.025;for(const o of cars){if(o===c)continue;let dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy);if(d<45){let ahead=Math.cos(c.a)*dx+Math.sin(c.a)*dy;if(ahead>0)c.s*=.96}}}function collideCars(){for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){let a=cars[i],b=cars[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<18){let nx=(a.x-b.x)/(d||1),ny=(a.y-b.y)/(d||1);a.x+=nx*2;a.y+=ny*2;b.x-=nx*2;b.y-=ny*2;a.s*=-.25;b.s*=-.25;if(a===player.inCar||b===player.inCar){addWanted(1);for(let k=0;k<5;k++)particles.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,c:'#f2b84b',life:20})}}}}function update(){if(!running)return;let ax=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,ay=(keys.KeyS?1:0)-(keys.KeyW?1:0)+jy;if(player.inCar){let c=player.inCar,gas=-ay,turn=ax;c.a+=turn*.043*(.45+Math.min(Math.abs(c.s),2));c.s+=gas*c.type.a;c.s*=.975;c.s=Math.max(-2.6,Math.min(c.type.max,c.s));let nx=c.x+Math.cos(c.a)*c.s,ny=c.y+Math.sin(c.a)*c.s;if(!inBuilding(nx,ny,16)){c.x=Math.max(0,Math.min(WORLD,nx));c.y=Math.max(0,Math.min(WORLD,ny))}else c.s*=-.3;player.x=c.x;player.y=c.y;player.a=c.a}else{let l=Math.hypot(ax,ay);if(l>.1){ax/=Math.max(1,l);ay/=Math.max(1,l);player.a=Math.atan2(ay,ax);let nx=player.x+ax*3.2,ny=player.y+ay*3.2;if(!inBuilding(nx,player.y))player.x=Math.max(0,Math.min(WORLD,nx));if(!inBuilding(player.x,ny))player.y=Math.max(0,Math.min(WORLD,ny))}}for(const c of cars)if(c.ai){trafficAI(c);let nx=c.x+Math.cos(c.a)*c.s,ny=c.y+Math.sin(c.a)*c.s;if(inBuilding(nx,ny,14)){c.a+=Math.PI/2;c.turnLock=50}else{c.x=(nx+WORLD)%WORLD;c.y=(ny+WORLD)%WORLD}}collideCars();for(const p of peds){if(Math.random()<.012)p.a+=(Math.random()-.5)*1.1;let nx=p.x+Math.cos(p.a)*p.s,ny=p.y+Math.sin(p.a)*p.s;if(!inBuilding(nx,ny,8)&&!onRoad(nx,ny)){p.x=nx;p.y=ny}else p.a+=2.2}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=Math.cos(b.a)*b.s;b.y+=Math.sin(b.a)*b.s;let hit=false;for(let j=peds.length-1;j>=0;j--)if(Math.hypot(peds[j].x-b.x,peds[j].y-b.y)<10){peds.splice(j,1);hit=true;addWanted(1);break}for(const c of cars)if(Math.hypot(c.x-b.x,c.y-b.y)<18){c.hp-=b.dmg;hit=true;if(c.hp<=0){c.c='#333';c.s=0;c.ai=false}break}if(--b.life<0||inBuilding(b.x,b.y)||hit)bullets.splice(i,1)}if(wanted>0){if(--wantedCool<=0){wanted--;wantedCool=900;hud()}let pc=cars.filter(c=>c.police).length;if(pc<wanted*3&&Math.random()<.02)spawnCar(cars.length,true)}for(let i=particles.length-1;i>=0;i--)if(--particles[i].life<=0)particles.splice(i,1)}function frame(){update();ctx.clearRect(0,0,W,H);let camx=Math.max(0,Math.min(WORLD-W,player.x-W/2)),camy=Math.max(0,Math.min(WORLD-H,player.y-H/2));ctx.save();ctx.translate(-camx,-camy);drawWorld();ctx.restore();requestAnimationFrame(frame)}hud();frame();})();</script></body></html>
