<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Crime City Classic</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;user-select:none;font-family:system-ui,Arial}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #000;font-weight:800}#top{position:absolute;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between}.box{background:#111c;border:1px solid #fff3;border-radius:10px;padding:7px 10px}#joy{position:absolute;left:18px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:120px;height:120px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:auto}#stick{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffff50}#buttons{position:absolute;right:16px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));display:grid;grid-template-columns:76px 76px;gap:9px;pointer-events:auto}.b{height:58px;border:1px solid #fff4;border-radius:14px;background:#1b1b1bdd;color:#fff;font-weight:900}.action{grid-column:1/3;background:#8a3b24dd}#start{position:fixed;inset:0;z-index:5;background:linear-gradient(#202f35,#51483b);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:22px}.panel{max-width:430px;background:#111d;border:1px solid #fff3;border-radius:18px;padding:22px}.panel button{border:0;border-radius:12px;background:#bd522d;color:#fff;padding:13px 20px;font-weight:900;font-size:16px}</style></head><body><canvas id="c"></canvas><div id="hud"><div id="top"><div class="box">CRIME CITY CLASSIC</div><div class="box" id="status">PIESZO · PISTOLET ∞</div></div><div id="joy"><div id="stick"></div></div><div id="buttons"><button class="b action" id="action">WEJDŹ DO AUTA</button><button class="b" id="shoot">STRZAŁ</button><button class="b" id="weapon">BROŃ</button></div></div><div id="start"><div class="panel"><h1>CRIME CITY CLASSIC</h1><p>Sandbox w klimacie klasycznych gier kryminalnych z widokiem z góry. Chodź po mieście, przejmuj auta i po prostu rób, co chcesz.</p><button id="play">WEJDŹ DO MIASTA</button></div></div><script>
const cv=document.querySelector('#c'),ctx=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,1.5);function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);const WORLD=2400,ROAD=150,BLOCK=300;const roads=[];for(let x=0;x<=WORLD;x+=BLOCK)roads.push({x:x-ROAD/2,y:0,w:ROAD,h:WORLD});for(let y=0;y<=WORLD;y+=BLOCK)roads.push({x:0,y:y-ROAD/2,w:WORLD,h:ROAD});const buildings=[];for(let gx=0;gx<WORLD;gx+=BLOCK)for(let gy=0;gy<WORLD;gy+=BLOCK){let m=ROAD/2+22,x=gx+m,y=gy+m,w=BLOCK-2*m,h=BLOCK-2*m;if(w>40&&h>40)buildings.push({x,y,w,h,c:['#8f7565','#a58d70','#777f82','#a06f65','#7b856e'][(gx/BLOCK+gy/BLOCK)%5]})}const player={x:WORLD/2+40,y:WORLD/2+40,a:0,r:11,inCar:null};const cars=[],peds=[],bullets=[];const colors=['#c23d36','#3972a4','#d0a23c','#4f8b5e','#ddd6c8','#292c30','#8b4c88','#d66d31'];function onRoad(x,y){return roads.some(r=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)}function spawnCar(i){let vertical=i%2===0,lane=(Math.floor(i/2)%8)*BLOCK;let c={x:vertical?lane+22:Math.random()*WORLD,y:vertical?Math.random()*WORLD:lane+22,a:vertical?Math.PI/2:0,s:1.1+Math.random()*1.2,max:4.2+Math.random()*2.3,c:colors[i%colors.length],ai:true,w:34,h:17};cars.push(c)}for(let i=0;i<45;i++)spawnCar(i);for(let i=0;i<65;i++){let p;do p={x:Math.random()*WORLD,y:Math.random()*WORLD,a:Math.random()*6.28,s:.25+Math.random()*.3,c:colors[(i+3)%colors.length]}while(onRoad(p.x,p.y));peds.push(p)}function collBuilding(x,y,r=8){return buildings.some(b=>x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)}let keys={},jx=0,jy=0,jid=null;addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyE')action();if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys[e.code]=0);const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=42,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>e.pointerId===jid&&jm(e);function je(e){if(e.pointerId===jid){jid=null;jx=jy=0;stick.style.transform=''}}joy.onpointerup=je;joy.onpointercancel=je;document.querySelector('#action').onclick=action;document.querySelector('#shoot').onclick=shoot;let weapon=0;const weapons=['PISTOLET','SMG','SHOTGUN'];document.querySelector('#weapon').onclick=()=>{weapon=(weapon+1)%weapons.length;hud()};function hud(){document.querySelector('#status').textContent=(player.inCar?'AUTO':'PIESZO')+' · '+weapons[weapon]+' ∞';document.querySelector('#action').textContent=player.inCar?'WYJDŹ Z AUTA':'WEJDŹ DO AUTA'}function action(){if(player.inCar){let c=player.inCar,ex=c.x+Math.cos(c.a+Math.PI/2)*28,ey=c.y+Math.sin(c.a+Math.PI/2)*28;if(!collBuilding(ex,ey)){player.x=ex;player.y=ey;c.ai=false;player.inCar=null;hud()}return}let best=null,bd=42;for(const c of cars){let d=Math.hypot(c.x-player.x,c.y-player.y);if(d<bd){bd=d;best=c}}if(best){best.ai=false;player.inCar=best;player.x=best.x;player.y=best.y;hud()}}function shoot(){if(player.inCar)return;let n=weapon===2?5:1;for(let i=0;i<n;i++){let a=player.a+(weapon===2?(i-2)*.1:0);bullets.push({x:player.x,y:player.y,a,life:55,s:weapon===1?11:9})}}function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle='#16191b';ctx.fillRect(-15,-11,7,22);ctx.fillRect(8,-11,7,22);ctx.fillStyle=c.c;ctx.fillRect(-18,-9,36,18);ctx.fillStyle='#9fc1cc';ctx.fillRect(-5,-7,13,14);ctx.fillStyle='#eee0a5';ctx.fillRect(16,-6,3,4);ctx.fillRect(16,2,3,4);ctx.restore()}function drawPed(p,hero=false){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=hero?'#f1d34e':p.c;ctx.beginPath();ctx.arc(0,0,hero?10:7,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(3,-2,11,4);ctx.restore()}function drawWorld(camx,camy){ctx.fillStyle='#567246';ctx.fillRect(0,0,WORLD,WORLD);for(const r of roads){ctx.fillStyle='#42484b';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#d7d0a8';ctx.lineWidth=3;ctx.setLineDash([22,18]);if(r.h>r.w){ctx.beginPath();ctx.moveTo(r.x+r.w/2,0);ctx.lineTo(r.x+r.w/2,WORLD);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(0,r.y+r.h/2);ctx.lineTo(WORLD,r.y+r.h/2);ctx.stroke()}}ctx.setLineDash([]);for(const b of buildings){ctx.fillStyle='#b9b3a7';ctx.fillRect(b.x-12,b.y-12,b.w+24,b.h+24);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#302d2b';ctx.fillRect(b.x+8,b.y+8,b.w-16,8);ctx.fillStyle='#79a7b8';for(let x=b.x+18;x<b.x+b.w-12;x+=28){ctx.fillRect(x,b.y+18,13,10);ctx.fillRect(x,b.y+b.h-28,13,10)}}for(const p of peds)drawPed(p);for(const c of cars)drawCar(c);for(const b of bullets){ctx.fillStyle='#ffd95c';ctx.beginPath();ctx.arc(b.x,b.y,3,0,6.28);ctx.fill()}if(!player.inCar)drawPed(player,true)}function update(){let ax=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,ay=(keys.KeyS?1:0)-(keys.KeyW?1:0)+jy;if(player.inCar){let c=player.inCar,gas=-ay,turn=ax;c.a+=turn*.045*(.4+Math.min(Math.abs(c.s),2));c.s+=gas*.11;c.s*=.97;c.s=Math.max(-2.2,Math.min(c.max,c.s));let nx=c.x+Math.cos(c.a)*c.s,ny=c.y+Math.sin(c.a)*c.s;if(!collBuilding(nx,ny,17)){c.x=nx;c.y=ny}else c.s*=-.25;player.x=c.x;player.y=c.y;player.a=c.a}else{let l=Math.hypot(ax,ay);if(l>.1){ax/=Math.max(1,l);ay/=Math.max(1,l);player.a=Math.atan2(ay,ax);let nx=player.x+ax*3.1,ny=player.y+ay*3.1;if(!collBuilding(nx,player.y))player.x=nx;if(!collBuilding(player.x,ny))player.y=ny}}for(const c of cars)if(c.ai){let nx=c.x+Math.cos(c.a)*c.s,ny=c.y+Math.sin(c.a)*c.s;c.x=(nx+WORLD)%WORLD;c.y=(ny+WORLD)%WORLD;if(!onRoad(c.x,c.y)){c.a+=Math.PI/2;c.x=Math.round(c.x/BLOCK)*BLOCK+22;c.y=Math.round(c.y/BLOCK)*BLOCK+22}}for(const p of peds){if(Math.random()<.015)p.a+=(Math.random()-.5)*1.2;let nx=p.x+Math.cos(p.a)*p.s,ny=p.y+Math.sin(p.a)*p.s;if(!collBuilding(nx,ny)&&!onRoad(nx,ny)){p.x=nx;p.y=ny}else p.a+=Math.PI*.7}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=Math.cos(b.a)*b.s;b.y+=Math.sin(b.a)*b.s;if(--b.life<0||collBuilding(b.x,b.y))bullets.splice(i,1)}}function frame(){update();ctx.clearRect(0,0,W,H);let camx=player.x-W/2,camy=player.y-H/2;ctx.save();ctx.translate(-camx,-camy);drawWorld(camx,camy);ctx.restore();requestAnimationFrame(frame)}document.querySelector('#play').onclick=()=>{document.querySelector('#start').style.display='none'};hud();frame();</script></body></html>
